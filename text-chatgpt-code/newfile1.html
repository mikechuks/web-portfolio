<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
body {
    background-color: #f7f7f7;
}

.card {
    border-radius: 15px;
}

.card-title {
    font-size: 2rem;
    margin-bottom: 20px;
}

.form-group input {
    font-size: 1.5rem;
    height: 60px;
    border: none;
    border-bottom: 2px solid #007bff;
    margin-bottom: 20px;
}

    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card mt-5">
                    <div class="card-body">
                        <h1 class="card-title text-center">Calculator</h1>
                        <div class="form-group">
                            <input type="text" id="display" class="form-control text-right" disabled>
                        </div>
                        <div class="btn-group btn-group-lg d-flex" role="group">
                            <button class="btn btn-secondary" onclick="buttonClicked('C')">C</button>
                            <button class="btn btn-secondary" onclick="buttonClicked('⌫')">⌫</button>
                            <button class="btn btn-secondary" onclick="buttonClicked('%')">%</button>
                            <button class="btn btn-primary" onclick="buttonClicked('/')">/</button>
                        </div>
                        <div class="btn-group btn-group-lg d-flex" role="group">
                            <button class="btn btn-light" onclick="buttonClicked('7')">7</button>
                            <button class="btn btn-light" onclick="buttonClicked('8')">8</button>
                            <button class="btn btn-light" onclick="buttonClicked('9')">9</button>
                            <button class="btn btn-primary" onclick="buttonClicked('*')">*</button>
                        </div>
                        <div class="btn-group btn-group-lg d-flex" role="group">
                            <button class="btn btn-light" onclick="buttonClicked('4')">4</button>
                            <button class="btn btn-light" onclick="buttonClicked('5')">5</button>
                            <button class="btn btn-light" onclick="buttonClicked('6')">6</button>
                            <button class="btn btn-primary" onclick="buttonClicked('-')">-</button>
                        </div>
                        <div class="btn-group btn-group-lg d-flex" role="group">
                            <button class="btn btn-light" onclick="buttonClicked('1')">1</button>
                            <button class="btn btn-light" onclick="buttonClicked('2')">2</button>
                            <button class="btn btn-light" onclick="buttonClicked('3')">3</button>
                            <button class="btn btn-primary" onclick="buttonClicked('+')">+</button>
                        </div>
                        <div class="btn-group btn-group-lg d-flex" role="group">
                            <button class="btn btn-light" onclick="buttonClicked('0')">0</button>
                            <button class="btn btn-light" onclick="buttonClicked('.')">.</button>
                            <button class="btn btn-success" onclick="buttonClicked('=')">=</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
function buttonClicked(value) {
    const display = document.getElementById('display');

    if (value === 'C') {
        display.value = '';
    } else if (value === '⌫') {
        display.value = display.value.slice(0, -1);
    } else if (value === '=') {
        try {
            display.value = eval(display.value);
        } catch (e) {
            display.value = 'Error';
        }
    } else {
        display.value += value;
    }
}


    </script>
</body>
</html>
